<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#091124" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg4)" />

  <!-- Blueprint Grid -->
  <g stroke="#22d3ee" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="240" y1="0" x2="240" y2="750" />
    <line x1="480" y1="0" x2="480" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
  </g>

  <text x="600" y="68" fill="#22d3ee" font-family="monospace" font-size="13" text-anchor="middle" letter-spacing="2">SYSTEM ARCHITECTURE BLUEPRINT // MULTI-TENANT TOPOLOGY</text>
  <text x="600" y="102" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">End-to-End Request Lifecycle &amp; Data Isolation</text>

  <!-- Client Tier (Left) -->
  <rect x="64" y="180" width="230" height="110" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
  <text x="179" y="220" fill="#22d3ee" font-family="monospace" font-size="12" text-anchor="middle">CLIENT TIER</text>
  <text x="179" y="246" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">React / Next.js SPA</text>
  <text x="179" y="270" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">SSR • Edge Caching</text>

  <rect x="64" y="340" width="230" height="110" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
  <text x="179" y="380" fill="#818cf8" font-family="monospace" font-size="12" text-anchor="middle">MOBILE CLIENTS</text>
  <text x="179" y="406" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">iOS &amp; Android Apps</text>
  <text x="179" y="430" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">JWT • FCM Push Tokens</text>

  <rect x="64" y="500" width="230" height="110" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
  <text x="179" y="540" fill="#c084fc" font-family="monospace" font-size="12" text-anchor="middle">EXTERNAL ECOSYSTEM</text>
  <text x="179" y="566" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Google / MS / Stripe</text>
  <text x="179" y="590" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Signed Webhooks • OAuth2</text>

  <!-- Connecting Lines to Gateway -->
  <path d="M 294 235 L 430 370" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M 294 395 L 430 395" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M 294 555 L 430 420" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Core API Gateway & Tenant Middleware (Center) -->
  <rect x="430" y="220" width="320" height="350" rx="22" fill="#0b1329" stroke="#22d3ee" stroke-width="2.5" />
  <rect x="456" y="246" width="268" height="32" rx="8" fill="#06b6d4" fill-opacity="0.15" />
  <text x="590" y="267" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">API GATEWAY &amp; CORE ENGINE</text>
  <text x="590" y="308" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Laravel 11 / Node.js</text>

  <rect x="456" y="332" width="268" height="54" rx="10" fill="#0f172a" stroke="#1e293b" />
  <text x="590" y="356" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tenant Context Resolver</text>
  <text x="590" y="374" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">Subdomain &amp; Header Isolation</text>

  <rect x="456" y="400" width="268" height="54" rx="10" fill="#0f172a" stroke="#1e293b" />
  <text x="590" y="424" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RBAC &amp; Policy Guard</text>
  <text x="590" y="442" fill="#818cf8" font-family="monospace" font-size="11" text-anchor="middle">Granular Role Permissions</text>

  <rect x="456" y="468" width="268" height="54" rx="10" fill="#0f172a" stroke="#1e293b" />
  <text x="590" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Service &amp; Queue Dispatcher</text>
  <text x="590" y="510" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="middle">Async Event Pipelines</text>

  <!-- Connecting Lines to Persistence Tier -->
  <path d="M 750 320 L 890 250" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M 750 400 L 890 400" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M 750 480 L 890 540" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Persistence & Worker Tier (Right) -->
  <rect x="890" y="180" width="246" height="125" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <text x="1013" y="218" fill="#10b981" font-family="monospace" font-size="12" text-anchor="middle">RELATIONAL STORAGE</text>
  <text x="1013" y="246" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MySQL / PostgreSQL</text>
  <text x="1013" y="272" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Normalized + B-Tree Indexes</text>

  <rect x="890" y="335" width="246" height="125" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
  <text x="1013" y="373" fill="#22d3ee" font-family="monospace" font-size="12" text-anchor="middle">IN-MEMORY CACHE</text>
  <text x="1013" y="401" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Redis Cluster</text>
  <text x="1013" y="427" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Sub-millisecond Read Cache</text>

  <rect x="890" y="490" width="246" height="125" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
  <text x="1013" y="528" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="middle">ASYNC WORKERS</text>
  <text x="1013" y="556" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Horizon &amp; Cron Daemons</text>
  <text x="1013" y="582" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">PDF Gen • Emails • Calendar Sync</text>
</svg>

