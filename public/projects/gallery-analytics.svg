<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg3)" />
  <circle cx="600" cy="375" r="320" fill="#06b6d4" fill-opacity="0.06" />

  <!-- Outer Card -->
  <rect x="44" y="40" width="1112" height="670" rx="22" fill="#070d1e" stroke="#1e293b" stroke-width="2" />
  <text x="84" y="92" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">Query Performance &amp; Telemetry Analytics</text>
  <text x="84" y="116" fill="#64748b" font-family="monospace" font-size="12">Composite B-Tree Index Tuning • Redis Pre-Warming • ~60% Latency Reduction Benchmark</text>

  <!-- Benchmark Comparison Panel -->
  <rect x="84" y="144" width="500" height="250" rx="16" fill="#0f172a" stroke="#1e293b" />
  <text x="112" y="180" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold">API Response Time Before vs. After (ms)</text>

  <!-- Bars -->
  <text x="112" y="225" fill="#94a3b8" font-family="monospace" font-size="12">GET /orders (Unindexed)</text>
  <rect x="112" y="235" width="420" height="18" rx="6" fill="#f43f5e" fill-opacity="0.8" />
  <text x="465" y="225" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">382.4 ms</text>

  <text x="112" y="285" fill="#94a3b8" font-family="monospace" font-size="12">GET /orders (Composite Index)</text>
  <rect x="112" y="295" width="110" height="18" rx="6" fill="url(#barCyan)" />
  <text x="235" y="309" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">42.1 ms</text>

  <text x="112" y="345" fill="#94a3b8" font-family="monospace" font-size="12">GET /orders (Redis Cached)</text>
  <rect x="112" y="355" width="32" height="18" rx="6" fill="#10b981" />
  <text x="156" y="369" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">3.2 ms (-99.1%)</text>

  <!-- Right Panel: Monthly Volume Bar Chart -->
  <rect x="612" y="144" width="504" height="250" rx="16" fill="#0f172a" stroke="#1e293b" />
  <text x="640" y="180" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold">Throughput Scaling Under Peak Load</text>

  <g transform="translate(650, 210)">
    <rect x="0" y="90" width="32" height="65" rx="6" fill="url(#barViolet)" />
    <rect x="55" y="70" width="32" height="85" rx="6" fill="url(#barViolet)" />
    <rect x="110" y="50" width="32" height="105" rx="6" fill="url(#barViolet)" />
    <rect x="165" y="60" width="32" height="95" rx="6" fill="url(#barCyan)" />
    <rect x="220" y="35" width="32" height="120" rx="6" fill="url(#barCyan)" />
    <rect x="275" y="20" width="32" height="135" rx="6" fill="url(#barCyan)" />
    <rect x="330" y="10" width="32" height="145" rx="6" fill="url(#barCyan)" />
    <rect x="385" y="0" width="32" height="155" rx="6" fill="#10b981" />
  </g>

  <!-- Bottom 3 Metric Cards -->
  <rect x="84" y="420" width="324" height="250" rx="16" fill="#0f172a" stroke="#1e293b" />
  <text x="112" y="458" fill="#22d3ee" font-family="monospace" font-size="12">DATABASE ENGINE</text>
  <text x="112" y="492" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">MySQL 8 &amp; PostgreSQL</text>
  <text x="112" y="528" fill="#94a3b8" font-family="sans-serif" font-size="13">• Covering B-Tree Indexes</text>
  <text x="112" y="556" fill="#94a3b8" font-family="sans-serif" font-size="13">• Materialized Reporting Views</text>
  <text x="112" y="584" fill="#94a3b8" font-family="sans-serif" font-size="13">• ACID Transactions &amp; Row Locks</text>
  <text x="112" y="612" fill="#10b981" font-family="monospace" font-size="12">Zero Deadlocks Recorded</text>

  <rect x="436" y="420" width="324" height="250" rx="16" fill="#0f172a" stroke="#1e293b" />
  <text x="464" y="458" fill="#a855f7" font-family="monospace" font-size="12">CACHE &amp; QUEUE TIER</text>
  <text x="464" y="492" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">Redis 7 + Horizon</text>
  <text x="464" y="528" fill="#94a3b8" font-family="sans-serif" font-size="13">• Tag-based Cache Invalidation</text>
  <text x="464" y="556" fill="#94a3b8" font-family="sans-serif" font-size="13">• Exponential Backoff Retries</text>
  <text x="464" y="584" fill="#94a3b8" font-family="sans-serif" font-size="13">• Dead-Letter Queue Monitoring</text>
  <text x="464" y="612" fill="#22d3ee" font-family="monospace" font-size="12">12,500+ Jobs / Minute</text>

  <rect x="788" y="420" width="328" height="250" rx="16" fill="#0f172a" stroke="#1e293b" />
  <text x="816" y="458" fill="#10b981" font-family="monospace" font-size="12">OBSERVABILITY &amp; SLA</text>
  <text x="816" y="492" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">Real-Time Telemetry</text>
  <text x="816" y="528" fill="#94a3b8" font-family="sans-serif" font-size="13">• Automated Slow Query Alerts</text>
  <text x="816" y="556" fill="#94a3b8" font-family="sans-serif" font-size="13">• Webhook Delivery Signatures</text>
  <text x="816" y="584" fill="#94a3b8" font-family="sans-serif" font-size="13">• Exportable CSV/PDF Audits</text>
  <text x="816" y="612" fill="#10b981" font-family="monospace" font-size="12">99.98% Verified SLA</text>
</svg>

