  <text x="924" y="230" fill="#e2e8f0" font-family="monospace" font-size="11">"field": "booking_slot",</text>
  <text x="924" y="252" fill="#e2e8f0" font-family="monospace" font-size="11">"type": "datetime_sync",</text>
